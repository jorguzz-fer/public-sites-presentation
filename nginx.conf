server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Assets aren't content-hashed, so force revalidation: the browser/CDN keeps
    # a copy but checks ETag on every request, and a new deploy (changed file =
    # new ETag) is served immediately instead of being masked by a stale cache.
    add_header Cache-Control "no-cache" always;

    # .jsx is loaded by Babel standalone; serve it as JavaScript instead of octet-stream
    location ~ \.jsx$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
